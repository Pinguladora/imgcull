name: Scheduled Release

on:
  schedule:
    - cron: "0 9 1 * *" # 1st of each month at 09:00 UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-bump:
    name: Check for unreleased commits and bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # octo-sts OIDC exchange
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo: "true"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
          persist-credentials: false
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguladora/imgcull
          identity: scheduled-release
      - name: Configure git credentials
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Pinguladora/imgcull.git"
      - name: Set up mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Check for unreleased commits and bump
        run: mise run release:check && mise run bump
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
